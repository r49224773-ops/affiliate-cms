backend:
  name: github
  repo: r49224773-ops/affiliate-cms   # ← change this
  branch: main
  base_url: https://api.github.com

media_folder: public/images
public_folder: /images

collections:
  - name: "posts"
    label: "Articles"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug (URL)", name: "slug", widget: "string", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Status", name: "status", widget: "select", options: ["draft", "published"], default: "draft" }
      - { label: "Featured Image", name: "featuredImage", widget: "image", required: false }
      - { label: "Categories", name: "categories", widget: "list", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Description", name: "seoDescription", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "products"
    label: "Product Reviews"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Name", name: "title", widget: "string" }
      - { label: "Slug (URL)", name: "slug", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Status", name: "status", widget: "select", options: ["draft", "published"], default: "draft" }
      - { label: "Featured Image", name: "featuredImage", widget: "image", required: false }
      - { label: "Brand", name: "brand", widget: "string", required: false }
      - { label: "Price", name: "price", widget: "string", required: false }
      - { label: "Rating (1-5)", name: "rating", widget: "number", min: 1, max: 5, step: 0.1, required: false }
      - { label: "Affiliate Link", name: "affiliateLink", widget: "string", required: false }
      - { label: "Pros", name: "pros", widget: "list", required: false }
      - { label: "Cons", name: "cons", widget: "list", required: false }
      - { label: "Categories", name: "categories", widget: "list", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "SEO Title", name: "seoTitle", widget: "string", required: false }
      - { label: "SEO Description", name: "seoDescription", widget: "text", required: false }
      - { label: "Review Body", name: "body", widget: "markdown" }
